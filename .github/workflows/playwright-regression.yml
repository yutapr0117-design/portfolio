name: Playwright Visual Regression & Behavior Validation

# ======================================================================
# 改善文書a Section 7.1/7.2: Artifacts > Declarations 原則を担保するE2Eテスト基盤
#
# - 7.1: Playwrightを用いた視覚的リグレッションテスト（ピクセル差分検知）
# - 7.2: 状態遷移・振る舞い検証（Behavior Checks）の自動化
#
# テスト定義: e2e/portfolio.spec.js（通常ファイル）
# 設定:       playwright.config.cjs（通常ファイル）
# スナップショットベースラインが存在しない場合、スクリーンショット差分テストは
# 自動的にスキップされます。ベースライン生成は update-playwright-snapshots.yml を使用。
# ======================================================================

on:
  # [FIX] main への push でも走らせる。理由は 2 つある。
  #   (1) **バッジが構造的に空白だった**。STATUS.md はオーナーの唯一の監査導線で、
  #       バッジ URL は `?branch=main` を指す。この workflow は `pull_request:` しか
  #       持たず main での実行が 0 件だったため、**BLOCKING の behavior gate だけが
  #       「no status」の空白バッジ**になっていた (実測 2026-08-17)。全 PR ゲートが
  #       緑でも、オーナーからは「緑」ではなく「何も分からない」状態だった。
  #   (2) **merge 後の main そのものを検証する層が無かった**。PR ごとに緑でも、
  #       別々の PR が main 上で相互作用して壊れることはありうる (PR は自分の
  #       head でしか検証されない)。push トリガはその合流点を実際に確かめる。
  #   paths フィルタは pull_request 側と同一にして、docs のみの merge で 5 分の
  #   ジョブが無駄に走らないようにする。
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'main.js'
      - 'js/**'
      - 'style.css'
      - 'aio-guard.js'
      - 'error-suppressor.js'
      - 'theme-init.js'
      - 'karte-init.js'
      - 'sw.js'
      - 'yuta-yokoi-ai-pm-orchestration-system.webp'
      - 'yuta-yokoi-sakura-swing-ai-generated-portfolio-bgm.mp3'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AI2AI.md'
      - '.well-known/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'e2e/**'
      - 'playwright.config.cjs'
      # The e2e toolchain itself lives in the dependency manifest: @playwright/test
      # (the runner) and @axe-core/playwright (a11y assertions) plus their transitive
      # deps can change e2e BEHAVIOR without any shipped-site file changing. Without
      # these in the trigger, a dep bump would skip the BLOCKING behavior gate and
      # ship an unverified test-toolchain change. Check 142 enforces their presence.
      - 'package.json'
      - 'package-lock.json'
      # このゲート自身の定義。job 構成 / env / step を書き換えれば behavior gate の
      # 挙動そのものが変わるのに、自身が paths に無いと **その変更だけは gate に
      # 検証されずに merge できる** (実測: #1099 がこの workflow を書き換えたが
      # playwright-validation は一度も走らなかった)。package.json と同じ理由。
      - '.github/workflows/playwright-regression.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'main.js'
      - 'js/**'
      - 'style.css'
      - 'aio-guard.js'
      - 'error-suppressor.js'
      - 'theme-init.js'
      - 'karte-init.js'
      - 'sw.js'
      - 'yuta-yokoi-ai-pm-orchestration-system.webp'
      - 'yuta-yokoi-sakura-swing-ai-generated-portfolio-bgm.mp3'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AI2AI.md'
      - '.well-known/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'e2e/**'
      - 'playwright.config.cjs'
      # The e2e toolchain itself lives in the dependency manifest: @playwright/test
      # (the runner) and @axe-core/playwright (a11y assertions) plus their transitive
      # deps can change e2e BEHAVIOR without any shipped-site file changing. Without
      # these in the trigger, a dep bump would skip the BLOCKING behavior gate and
      # ship an unverified test-toolchain change. Check 142 enforces their presence.
      - 'package.json'
      - 'package-lock.json'
      # このゲート自身の定義。job 構成 / env / step を書き換えれば behavior gate の
      # 挙動そのものが変わるのに、自身が paths に無いと **その変更だけは gate に
      # 検証されずに merge できる** (実測: #1099 がこの workflow を書き換えたが
      # playwright-validation は一度も走らなかった)。package.json と同じ理由。
      - '.github/workflows/playwright-regression.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  playwright-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # v80+ CI hygiene: cache npm downloads keyed on
          # package-lock.json so `npm ci` restores from cache on repeat runs.
          cache: 'npm'

      - name: Install Playwright and dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Behavior / functionality tests are the BLOCKING gate. Per Session Record #20 the
      # repository (not the rendered site) is the portfolio; the site is an appendage whose
      # functionality (loads / displays / comprehensible) must be protected, but pixel-level
      # visual regressions are acceptable. So functionality e2e blocks merges …
      - name: Run behavior / functionality tests (BLOCKING gate)
        # E2E_HERMETIC=1: localhost 以外への DNS を即 NOTFOUND にして、BLOCKING ゲートを
        # 第三者 CDN (KARTE / Google Fonts) から切り離す。実測では 1 ナビゲーションごとに
        # 6 ホストへ 9 リクエストが飛び、goto の既定 waitUntil='load' がそれを待っていたため、
        # ゲートの合否が外部の可用性・レイテンシに依存していた (2026-08-10 に .hero-section の
        # 30s timeout として flake 化)。遮断後は goto 447ms → 39ms・fatal なし。
        # 次ステップの screenshot は実フォントが要るので **意図的に付けない** (Check 416 参照)。
        env:
          E2E_HERMETIC: '1'
        run: npx playwright test --config=playwright.config.cjs --grep-invert "screenshot regression" --reporter=list

      # … and the homepage pixel screenshot is ADVISORY (observed, never blocking). An intentional
      # visual change makes this step red until the baseline is regenerated via the human-merged
      # update-playwright-snapshots.yml path — that red is expected and does NOT gate merges.
      - name: Run visual regression (ADVISORY — non-blocking, see Session Record #20 §3(B))
        continue-on-error: true
        run: npx playwright test --config=playwright.config.cjs --grep "screenshot regression" --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-snapshot-diffs
          path: |
            e2e/**/*-diff.png
            e2e/**/*-actual.png
          retention-days: 7
          if-no-files-found: ignore
