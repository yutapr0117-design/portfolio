name: Playwright Visual Regression & Behavior Validation

# ======================================================================
# 改善文書a Section 7.1/7.2: Artifacts > Declarations 原則を担保するE2Eテスト基盤
#
# - 7.1: Playwrightを用いた視覚的リグレッションテスト（ピクセル差分検知）
# - 7.2: 状態遷移・振る舞い検証（Behavior Checks）の自動化
#
# テスト定義: e2e/portfolio.spec.js（通常ファイル）
# 設定:       playwright.config.cjs（通常ファイル）
# スナップショットベースラインが存在しない場合、スクリーンショット差分テストは
# 自動的にスキップされます。ベースライン生成は update-playwright-snapshots.yml を使用。
# ======================================================================

on:
  # [FIX] main への push でも走らせる。理由は 2 つある。
  #   (1) **バッジが構造的に空白だった**。STATUS.md はオーナーの唯一の監査導線で、
  #       バッジ URL は `?branch=main` を指す。この workflow は `pull_request:` しか
  #       持たず main での実行が 0 件だったため、**BLOCKING の behavior gate だけが
  #       「no status」の空白バッジ**になっていた (実測 2026-08-17)。全 PR ゲートが
  #       緑でも、オーナーからは「緑」ではなく「何も分からない」状態だった。
  #   (2) **merge 後の main そのものを検証する層が無かった**。PR ごとに緑でも、
  #       別々の PR が main 上で相互作用して壊れることはありうる (PR は自分の
  #       head でしか検証されない)。push トリガはその合流点を実際に確かめる。
  #   paths フィルタは pull_request 側と同一にして、docs のみの merge で 5 分の
  #   ジョブが無駄に走らないようにする。
  push:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'main.js'
      - 'js/**'
      - 'style.css'
      - 'aio-guard.js'
      - 'error-suppressor.js'
      - 'theme-init.js'
      - 'karte-init.js'
      - 'sw.js'
      - 'yuta-yokoi-ai-pm-orchestration-system.webp'
      - 'yuta-yokoi-sakura-swing-ai-generated-portfolio-bgm.mp3'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AI2AI.md'
      - '.well-known/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'e2e/**'
      - 'playwright.config.cjs'
      # The e2e toolchain itself lives in the dependency manifest: @playwright/test
      # (the runner) and @axe-core/playwright (a11y assertions) plus their transitive
      # deps can change e2e BEHAVIOR without any shipped-site file changing. Without
      # these in the trigger, a dep bump would skip the BLOCKING behavior gate and
      # ship an unverified test-toolchain change. Check 142 enforces their presence.
      - 'package.json'
      - 'package-lock.json'
      # このゲート自身の定義。job 構成 / env / step を書き換えれば behavior gate の
      # 挙動そのものが変わるのに、自身が paths に無いと **その変更だけは gate に
      # 検証されずに merge できる** (実測: #1099 がこの workflow を書き換えたが
      # playwright-validation は一度も走らなかった)。package.json と同じ理由。
      - '.github/workflows/playwright-regression.yml'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'index.html'
      - 'main.js'
      - 'js/**'
      - 'style.css'
      - 'aio-guard.js'
      - 'error-suppressor.js'
      - 'theme-init.js'
      - 'karte-init.js'
      - 'sw.js'
      - 'yuta-yokoi-ai-pm-orchestration-system.webp'
      - 'yuta-yokoi-sakura-swing-ai-generated-portfolio-bgm.mp3'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AI2AI.md'
      - '.well-known/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'e2e/**'
      - 'playwright.config.cjs'
      # The e2e toolchain itself lives in the dependency manifest: @playwright/test
      # (the runner) and @axe-core/playwright (a11y assertions) plus their transitive
      # deps can change e2e BEHAVIOR without any shipped-site file changing. Without
      # these in the trigger, a dep bump would skip the BLOCKING behavior gate and
      # ship an unverified test-toolchain change. Check 142 enforces their presence.
      - 'package.json'
      - 'package-lock.json'
      # このゲート自身の定義。job 構成 / env / step を書き換えれば behavior gate の
      # 挙動そのものが変わるのに、自身が paths に無いと **その変更だけは gate に
      # 検証されずに merge できる** (実測: #1099 がこの workflow を書き換えたが
      # playwright-validation は一度も走らなかった)。package.json と同じ理由。
      - '.github/workflows/playwright-regression.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  playwright-validation:
    runs-on: ubuntu-latest
    # [FIX] 15 → 20。理由は下の install step に個別 timeout を入れたことと対。install を
    #   8 分で頭打ちにしたので、最悪ケースでも install 8 + behavior ~5 + screenshot ~1 で
    #   収まる。15 のままだと install が上限まで粘った時に behavior の予算が残らず、
    #   「gate が走れないまま job が cancel される」= 下で直している当の失敗モードを
    #   job 側から再生産してしまう。通常時の実測は合計 6m25s。
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # v80+ CI hygiene: cache npm downloads keyed on
          # package-lock.json so `npm ci` restores from cache on repeat runs.
          cache: 'npm'

      # [FIX] 依存インストールに **step 個別の timeout** を持たせる。付けないと、install が
      #   詰まったときに job 全体の timeout-minutes が発火して job ごと cancel され、
      #   後続の step は `skipped` になる —— このとき CI は BLOCKING gate の赤と
      #   **見分けが付かない** 単なる `fail` を表示する (実測 2026-08-18 PR #1136:
      #   install が 15m15s 粘って job が cancel され、behavior gate は一度も走っていない
      #   のに playwright-validation が赤。rerun したら 6m25s で全緑 = 回帰はゼロだった)。
      #   step 個別の timeout なら **その step だけが失敗** し、job は続行するので
      #   下の "Explain failure attribution" が動いて帰属を書ける。
      #   **この前提は推測せず実測した** (使い捨て probe PR #1137 で timeout を 1 分にして観測):
      #     `##[error]The action 'Install Playwright and dependencies' has timed out after 1 minutes.`
      #     → install の conclusion = **failure** (cancelled ではない) / behavior = skipped
      #     → "Explain failure attribution" は **success で実行され**、
      #        INSTALL_OUTCOME=failure / BEHAVIOR_OUTCOME=skipped を読んで正しい枝に入った。
      #   もし step timeout が job ごと cancel する仕様だったら後続 step は動かず設計が丸ごと
      #   崩れていた。ここは設計の土台なので実測で固めてある。
      #   8 分の根拠: 通常の install 実測は約 2 分。4 倍の余裕で「遅い」と「詰まった」を分ける。
      # [計測 2026-08-18] この step を「速くしよう」と思ったら **先にここを読むこと**。
      #   成功時の内訳を実測した: `npm ci` = 2s (setup-node の npm cache が効いている) /
      #   `--with-deps` の apt = **2m41s (全体の ~94%)** / ブラウザ DL = **11s**。
      #   → **ブラウザを actions/cache しても 11 秒しか縮まない**。最初に立てた
      #     「ブラウザ DL が重いからキャッシュする」という仮説は実測で外れた。
      #   → **`--with-deps` を外すのは不可 (probe PR #1144 で実測)。** Chromium は起動し
      #     300+ テストのうち 1 件を除いて通るが、`#/quiz` の描画コストが **636ms / 896ms
      #     (2 回とも再現)** と実測基準 11〜25ms から桁で悪化する (おそらくフォント関連の
      #     共有ライブラリ欠落で、24,500 文字のページが遅い fallback 経路に落ちる)。
      #     他の全テストが緑なので、#1028 で足した描画コストのテスト 1 本だけが捕捉層だった。
      #   したがって install 停滞 (本日 2 件: #1136 15m15s / #1143 8 分 timeout) への正しい
      #   対処は「速くする」ではなく、下の帰属レイヤで **infra の赤と回帰の赤を区別して
      #   rerun させる**こと。
      # [計測で否定 2026-08-18] **in-job リトライは効かない (むしろ有害)。**一度実装して実測した:
      #   試行 1 の `timeout` は npx を殺すが **子の apt-get が生き残って /var/lib/apt/lists/lock を
      #   保持し続ける**ため、試行 2 は 2 秒で
      #     `E: Could not get lock /var/lib/apt/lists/lock. It is held by process 2261 (apt-get)`
      #     → `Installation process exited with code: 100`
      #   と即死する (実測 PR #1147)。つまりリトライは **狙った失敗モードでだけ機能しない**。
      #   加えて per-attempt の timeout は **実測で 6m20s かかった正常な install を 5 分で打ち切る** —
      #   入れる前より悪い。apt を強制終了して dpkg を修復してから再試行する形は、
      #   トランザクション途中の kill を伴い、CI の土台を壊すリスクの方が大きい。
      #   一方 **runner を引き直す rerun は実測 3/3 で成功** (1m33s / 2m55s / 6m20s)。
      #   したがって正しい対処は「job 内で粘る」ではなく **下の帰属レイヤで infra の赤と
      #   回帰の赤を区別し、rerun させる**こと。速くする試みが全滅した経緯は mirror doc を参照。
      #   step 個別 timeout の意義は変わらない: 停滞を **その step の失敗**に閉じ込め、
      #   job ごと cancel されて後続の帰属 step まで skip されるのを防ぐ (#1136 の失敗モード)。
      #   11 分の根拠: 成功時の実測上限 6m20s の ~1.7 倍。job の 20 分にも収まる。
      - name: Install Playwright and dependencies
        id: install
        timeout-minutes: 11
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Behavior / functionality tests are the BLOCKING gate. Per Session Record #20 the
      # repository (not the rendered site) is the portfolio; the site is an appendage whose
      # functionality (loads / displays / comprehensible) must be protected, but pixel-level
      # visual regressions are acceptable. So functionality e2e blocks merges …
      - name: Run behavior / functionality tests (BLOCKING gate)
        id: behavior
        # E2E_HERMETIC=1: localhost 以外への DNS を即 NOTFOUND にして、BLOCKING ゲートを
        # 第三者 CDN (KARTE / Google Fonts) から切り離す。実測では 1 ナビゲーションごとに
        # 6 ホストへ 9 リクエストが飛び、goto の既定 waitUntil='load' がそれを待っていたため、
        # ゲートの合否が外部の可用性・レイテンシに依存していた (2026-08-10 に .hero-section の
        # 30s timeout として flake 化)。遮断後は goto 447ms → 39ms・fatal なし。
        # 次ステップの screenshot は実フォントが要るので **意図的に付けない** (Check 416 参照)。
        env:
          E2E_HERMETIC: '1'
        run: npx playwright test --config=playwright.config.cjs --grep-invert "screenshot regression" --reporter=list

      # … and the homepage pixel screenshot is ADVISORY (observed, never blocking). An intentional
      # visual change makes this step red until the baseline is regenerated via the human-merged
      # update-playwright-snapshots.yml path — that red is expected and does NOT gate merges.
      - name: Run visual regression (ADVISORY — non-blocking, see Session Record #20 §3(B))
        continue-on-error: true
        run: npx playwright test --config=playwright.config.cjs --grep "screenshot regression" --reporter=list

      # [FIX] 赤の **帰属** を job 自身に書かせる。この workflow は「BLOCKING gate」を名乗るが、
      #   赤くなった理由が (a) gate が回帰を検出した のか (b) gate が一度も走らなかった のかは
      #   従来ジョブ API を掘らないと分からなかった。オーナーの runtime 役割は「制御と監査」で、
      #   監査の入口はバッジと CI の表示ゆえ、**区別できない赤は「検証された」と誤読される**。
      #   (b) は「何も検証していない」であって「壊れている」ではない —— rerun が正しい対処で、
      #   (a) の rerun は本物の回帰を握り潰す。まさに逆の対応が要るので取り違えは高くつく。
      #   同じ class は #1127 (週次 probe が timeout で cancel され SURVIVED 検出が消えた) で
      #   一度踏んでおり、これが 2 例目。
      - name: Explain failure attribution
        if: failure()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior.outcome }}
        run: |
          {
            if [ "$BEHAVIOR_OUTCOME" = "failure" ]; then
              echo "### ❌ BLOCKING behavior gate が回帰を検出しました"
              echo ""
              echo "gate は**実際に実行され**、失敗したテストがあります。"
              echo "**rerun してはいけません** — 失敗したテストを読んで原因を直してください。"
            elif [ "$INSTALL_OUTCOME" = "failure" ]; then
              echo "### ⚠️ BLOCKING behavior gate は **一度も実行されていません**"
              echo ""
              echo "依存インストールが step timeout (8 分) に達したため中断しました。"
              echo "これは**インフラの失敗であって回帰ではありません**（何も検証されていない）。"
              echo "\`gh run rerun <run-id> --failed\` で再実行してください。"
            else
              echo "### ℹ️ behavior gate 以外の step が失敗しました"
              echo ""
              echo "install=\`$INSTALL_OUTCOME\` / behavior=\`$BEHAVIOR_OUTCOME\`"
              echo "どの step が赤いかを確認してください（screenshot は ADVISORY ゆえ job を落としません）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload snapshot diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-snapshot-diffs
          path: |
            e2e/**/*-diff.png
            e2e/**/*-actual.png
          retention-days: 7
          if-no-files-found: ignore
