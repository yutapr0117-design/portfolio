name: Mutation Probe (safety-net self-check)

# ======================================================================
# 安全網そのものを検証する層を CI に載せる（週次）
#
# WHY THIS EXISTS
#   consistency Check 群と behavior e2e は「実装の回帰」を守る。だが
#   **その安全網自体が回帰していないか** は誰も守っていなかった。
#   mutation probe は既知のバグを人工的に再注入し、対応する Check / e2e が
#   実際に RED になることを確認する唯一の手段だが、**PR の CI では走らない**
#   （consistency 側は数分、behavior 側は各 mutation ごとに playwright を
#   起動するため 20〜30 分かかり、全 PR に載せると merge 待ちが破綻する）。
#
#   結果としてこの層は「気付いた人が手で走らせる」だけの状態で、実際に
#   2026-08-10 の cross-tab 修正では、挙動を変えたことで **既存テストが
#   延期パスを踏んで何を壊しても緑になる**（＝安全網が黙って鈍る）事故が
#   起きていた。手で走らせて気付けたが、気付かなければ検出手段はゼロだった。
#
#   週次で全件を走らせ、SURVIVED（＝どの Check / e2e も捕捉しなかった
#   mutation）が 1 件でもあれば **run を落として可視化する**。
#
# 走るもの:
#   1. consistency probe … MUTATIONS を 1 件ずつ当て、check_repository_consistency.py が
#      Check 362（anchor orphan）以外の error を出すことを確認する（帰属は Check 399 が強制）
#   2. behavior probe …… E2E_MUTATIONS を 1 件ずつ当て、`test` フィールドが指す
#      playwright テストが実際に fail することを確認する
#
# 失敗したときの読み方:
#   SURVIVED = その mutation を誰も捕捉していない。安全網の穴か、
#              対応するテストが鈍った（前提が崩れた）かのどちらか。
#   CRASHED  = gate が traceback で停止した。「Check が働いた」ではなく
#              「その Check は走らず以降も masking された」状態（Check 400 参照）。
# ======================================================================

on:
  schedule:
    - cron: '0 2 * * 1'  # 毎週月曜 JST 11:00（UTC 02:00）。aio-monitoring の 1 時間後にずらす
  workflow_dispatch:      # 手動実行も可能

permissions:
  contents: read          # チェックアウトのみ。コミットも Issue 作成もしない

# 手動実行が週次スケジュールと重なっても、probe は shipped file を一時的に書き換えて
# 復元するため並行実行させない（同一ワークツリーではないが、無駄な二重実行を避ける）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # consistency と behavior を **並列の別ジョブ**にする (2026-08-10 分割)。
  #
  # WHY (実測に基づく・2026-08-10 の run 31397732391):
  #     全体          38m48s  (14:21:44 → 15:00:32)
  #     consistency   約 10 分 (306 mutations)
  #     behavior      約 29 分 (143 mutations・playwright を mutation ごとに起動)
  #   直列なので wall-clock は両者の和になっていた。**並列化で約 29 分**（= 遅い方）になり、
  #   26% 短縮する。mirror doc が定めた「45 分を超えたら rotate か分割を検討」の閾値には
  #   まだ達していないが、mutation は増分ごとに増える一方で、超えてから動くと
  #   「安全網の検証が止まっている」ことに気付きにくい (この workflow は PR を止めないため、
  #   赤に気付けるのは STATUS.md のバッジだけ)。**閾値に当たる前に構造を直す**。
  #
  #   分割のもう一つの利点は **どちらの層が壊れたのかがジョブ単位で分かる** こと
  #   (従来は 1 つの赤としか見えず、ログを開くまで区別できなかった)。
  #   両者は互いに独立 (別の安全網を検証する) ので直列である必然性が無く、
  #   consistency 側は playwright を使わないので npm ci / browser install も不要になる。
  # ────────────────────────────────────────────────────────────────────────────
  consistency:
    name: Consistency safety-net self-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # consistency probe は playwright を起動しないので npm ci / browser install は不要。
      # (behavior 側だけが node/chromium を要る = 分割によって consistency の起動コストも減る)
      - name: Run consistency probe
        env:
          MUTATION_PROBE: '1'
        run: python3 .github/scripts/mutation_probe.py

      - name: Assert working tree is restored
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::mutation probe left the working tree modified — 復元ロジックの回帰"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean — 全 mutation が復元された"

  behavior:
    # [FIX] **シャーディング**。behavior probe は mutation ごとに Playwright を起動するため
    #   所要が mutation 数にほぼ比例する。2026-08-17 に mutation を 240 → 289 件へ増やしたら
    #   単一ジョブの実測が **55 分 17 秒**となり timeout-minutes: 55 に到達し **cancelled** で
    #   打ち切られた。cancelled は success でも failure でもないので、**安全網の自己検証が
    #   「結果不明」のまま静かに止まる**最悪の形になる (週次ゆえ誰も rerun しない)。
    #   timeout を上げるだけでは mutation を足すたび再発するので shard で wall-clock を割る。
    #   分割は `index % n` の決定的な剰余で、全 shard の和が必ず全 mutation を 1 回ずつ覆う
    #   (mutation_probe.py の _parse_shard に単体検証あり)。
    #   **4 分割では足りなかった (2026-08-17 実測)**: 14m56s / 17m22s / **30m15s** / 15m46s と
    #   shard 3 だけ約 2 倍になり timeout 30 分に到達して cancelled。剰余は「均等な件数」を
    #   作るが「均等な所要」は作らない (長い待ちを含むテストは 1 mutation で 30 秒超)。
    #   8 分割へ上げて 1 shard の粒度を細かくし、最悪ケースを半減させる。
    name: Behavior (e2e) safety-net self-check (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 8 分割後の最悪ケース想定 ~15 分 (4 分割の実測最悪 30m15s の半分) に 2 倍の余裕
    strategy:
      fail-fast: false    # 1 shard が落ちても他 shard の結果を必ず得る (どこが vacuous か知りたい)
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # MUTATION_PROBE=1 は SW を block し (false SURVIVED 対策)、E2E_HERMETIC=1 は外部 CDN を
      # 遮断する (false CAUGHT 対策)。どちらも mutation_probe.py が子プロセスへ渡す (Check 416)。
      - name: Run behavior (e2e) probe
        env:
          MUTATION_PROBE: '1'
        run: python3 .github/scripts/mutation_probe.py --e2e --shard ${{ matrix.shard }}/8

      - name: Assert working tree is restored
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::mutation probe left the working tree modified — 復元ロジックの回帰"
            git status --porcelain
            exit 1
          fi
          echo "working tree clean — 全 mutation が復元された"
